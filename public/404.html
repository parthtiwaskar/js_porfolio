<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | Sanika Wasade</title>
    <style>
      :root {
        --bg: #090909;
        --panel: #111111;
        --text: #f3f3ef;
        --muted: #a1a1a1;
        --accent: #59ae17;
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      .card {
        width: min(540px, calc(100% - 2rem));
        padding: 3rem;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(17, 17, 17, 0.86);
        text-align: center;
      }

      .code {
        color: var(--accent);
        letter-spacing: 0.4rem;
        font-weight: 700;
        font-size: 0.8rem;
      }

      h1 {
        font-size: clamp(2rem, 5vw, 4rem);
        margin: 1rem 0;
      }

      p {
        color: var(--muted);
      }

      a {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.9rem 1.5rem;
        background: var(--accent);
        color: #101010;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="code">404 / LOST</div>
      <h1>Page not found.</h1>
      <p>The page you are looking for may have moved or does not exist.</p>
      <a href="/">Return home</a>
    </div>
  </body>
</html>
